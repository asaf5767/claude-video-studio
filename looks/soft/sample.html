<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Soft look sample</title>
<style>
@font-face{font-family:"Heebo";font-style:normal;font-weight:100 900;font-display:swap;src:url(../../style-library/dist/assets/fonts/heebo-100-900-hebrew.woff) format("woff");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Heebo";font-style:normal;font-weight:100 900;font-display:swap;src:url(../../style-library/dist/assets/fonts/heebo-100-900-latin.woff) format("woff");unicode-range:U+0000-00FF}
@font-face{font-family:"Bellefair";font-style:normal;font-weight:400;font-display:swap;src:url(../../style-library/dist/assets/fonts/bellefair-400-hebrew.woff) format("woff");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Bellefair";font-style:normal;font-weight:400;font-display:swap;src:url(../../style-library/dist/assets/fonts/bellefair-400-latin.woff) format("woff");unicode-range:U+0000-00FF}
*{box-sizing:border-box}
html,body{margin:0;width:540px;height:960px;overflow:hidden;background:#000;font-family:Heebo,sans-serif}
.scene{position:relative;width:540px;height:960px;overflow:hidden;filter:sepia(.12) saturate(1.04) brightness(1.03) contrast(.97)}
.room{position:absolute;inset:0;background:linear-gradient(180deg,#efe7d8 0%,#e3d8c3 46%,#cdbea2 78%,#b4a186 100%)}
.bokeh{position:absolute;inset:-40px;filter:blur(26px);opacity:.75}
.bokeh span{position:absolute;border-radius:50%}
.b1{top:6%;right:4%;width:220px;height:220px;background:radial-gradient(circle,#fff3dd,#e8c98f 70%,transparent 72%)}
.b2{top:38%;left:-6%;width:170px;height:170px;background:radial-gradient(circle,#f3ded0,#c9a788 70%,transparent 72%)}
.b3{top:4%;left:18%;width:90px;height:90px;background:radial-gradient(circle,#fff8ec,#e3c89e 70%,transparent 72%)}
.b4{bottom:30%;right:10%;width:120px;height:120px;background:radial-gradient(circle,#f6e7cf,#cdb087 70%,transparent 72%)}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 50%,rgba(60,44,28,.28) 100%)}
.person{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:118%}
.person img{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 30px rgba(40,28,16,.28))}
.title{position:absolute;top:13%;left:0;right:0;text-align:center;font-family:Bellefair;font-weight:400;font-size:56px;color:#4a3b2a;text-shadow:0 2px 10px rgba(0,0,0,.14)}
.caption{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);max-width:82%;background:rgba(46,36,26,.52);color:#fdf8ef;font-family:Heebo;font-weight:400;font-size:27px;line-height:1.3;padding:14px 26px;border-radius:22px;text-align:center;white-space:nowrap}
.ltr{margin:0 .15em}
</style>
</head>
<body>
<div class="scene">
  <div class="room"></div>
  <div class="bokeh"><span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span></div>
  <div class="vignette"></div>
  <div class="title">רך</div>
  <div class="person"><img src="../_presenter/presenter-cutout.png" alt=""></div>
  <div class="caption">ה-<bdi class="ltr" dir="ltr">AI</bdi> עושה הכל בעדינות</div>
</div>
</body>
</html>
