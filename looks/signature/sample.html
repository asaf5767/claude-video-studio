<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Signature look sample</title>
<style>
@font-face{font-family:"Heebo";font-style:normal;font-weight:100 900;font-display:swap;src:url(../../style-library/dist/assets/fonts/heebo-100-900-hebrew.woff) format("woff");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Heebo";font-style:normal;font-weight:100 900;font-display:swap;src:url(../../style-library/dist/assets/fonts/heebo-100-900-latin.woff) format("woff");unicode-range:U+0000-00FF}
*{box-sizing:border-box}
html,body{margin:0;width:540px;height:960px;overflow:hidden;background:#000;font-family:Heebo,sans-serif}
.scene{position:relative;width:540px;height:960px;overflow:hidden;filter:saturate(.92) contrast(1.02)}
.room{position:absolute;inset:0;background:linear-gradient(180deg,#f1efe9 0%,#e7e3da 55%,#d7d2c6 100%)}
.block{position:absolute;top:0;bottom:0;right:0;width:10%;background:#ff6b2c}
.person{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:94%}
.person img{width:100%;height:auto;display:block;filter:drop-shadow(0 16px 24px rgba(0,0,0,.18))}
.title{position:absolute;top:8%;left:0;right:0;text-align:center}
.title b{font-family:Heebo;font-weight:800;font-size:58px;color:#1c1c1c;position:relative}
.title .mark{display:block;width:120px;height:9px;background:#ff6b2c;border-radius:4px;margin:6px auto 0}
.caption{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);color:#1c1c1c;font-family:Heebo;font-weight:700;font-size:28px;text-align:center;white-space:nowrap}
.caption .u{position:relative}
.caption .u::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:6px;background:#ff6b2c;border-radius:3px}
.ltr{margin:0 .15em}
</style>
</head>
<body>
<div class="scene">
  <div class="room"></div>
  <div class="block"></div>
  <div class="title"><b>חתימה</b><span class="mark"></span></div>
  <div class="person"><img src="../_presenter/presenter-cutout.png" alt=""></div>
  <div class="caption"><span class="u">הסוד</span> שה-<bdi class="ltr" dir="ltr">AI</bdi> לא מספר</div>
</div>
</body>
</html>
