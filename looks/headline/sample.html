<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Headline look sample</title>
<style>
@font-face{font-family:"Heebo";font-style:normal;font-weight:100 900;font-display:swap;src:url(../../style-library/dist/assets/fonts/heebo-100-900-hebrew.woff) format("woff");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Heebo";font-style:normal;font-weight:100 900;font-display:swap;src:url(../../style-library/dist/assets/fonts/heebo-100-900-latin.woff) format("woff");unicode-range:U+0000-00FF}
@font-face{font-family:"Karantina";font-style:normal;font-weight:700;font-display:swap;src:url(../../style-library/dist/assets/fonts/karantina-700-hebrew.woff2) format("woff2");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Karantina";font-style:normal;font-weight:700;font-display:swap;src:url(../../style-library/dist/assets/fonts/karantina-700-latin.woff2) format("woff2");unicode-range:U+0000-00FF}
*{box-sizing:border-box}
html,body{margin:0;width:540px;height:960px;overflow:hidden;background:#000;font-family:Heebo,sans-serif}
.scene{position:relative;width:540px;height:960px;overflow:hidden;filter:saturate(1.3) contrast(1.12) brightness(1.02)}
.room{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,#4a1a5c 0%,#2a1033 42%,#160a1e 76%,#0a0510 100%)}
.glow{position:absolute;top:-10%;left:50%;transform:translateX(-50%);width:120%;height:40%;background:radial-gradient(ellipse at center,rgba(255,107,44,.35),transparent 70%);filter:blur(10px)}
.block{position:absolute;top:2%;left:6%;right:6%;height:22%;background:#160a1e;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.streak{position:absolute;width:140%;height:10%;background:linear-gradient(90deg,#ff6b2c,#ffe066);transform:rotate(-7deg)}
.streak1{top:28%;left:-20%;opacity:.9}
.streak2{top:36%;left:-20%;opacity:.35}
.person{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:94%}
.person img{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 26px rgba(0,0,0,.5))}
.headline{position:absolute;top:4%;left:0;right:0;text-align:center;font-family:Karantina;font-weight:700;font-size:118px;color:#fff066;line-height:.95;text-shadow:0 4px 0 rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.55)}
.caption{position:absolute;bottom:8%;left:50%;transform:translateX(-50%) scale(1.04);color:#fff;font-family:Heebo;font-weight:800;font-size:30px;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.6);white-space:nowrap}
.caption .key{color:#ffe066;font-size:1.1em}
.ltr{margin:0 .15em}
</style>
</head>
<body>
<div class="scene">
  <div class="room"></div>
  <div class="glow"></div>
  <div class="streak streak2"></div>
  <div class="streak streak1"></div>
  <div class="block"></div>
  <div class="headline">למה?!</div>
  <div class="person"><img src="../_presenter/presenter-cutout.png" alt=""></div>
  <div class="caption"><bdi class="ltr" dir="ltr">AI</bdi> משנה את <span class="key">הכל</span> עכשיו</div>
</div>
</body>
</html>
